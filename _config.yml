title: "Suede x402 Media API"
description: "Three pay-per-call media APIs over x402: music for $0.50, video for $4.99, and image for $0.15. USDC on Base, no API key."
url: "https://x402.suedeai.ai"
lang: en
theme: jekyll-theme-primer
markdown: kramdown

# Share card for og:image and twitter:image. The head tags, title and JSON-LD
# are written by hand in _layouts/default.html rather than by jekyll-seo-tag.
social_image: /assets/x402-social-card.png
social_image_alt: "Suede x402 Media API: pay-per-call endpoints POST /create-music, POST /agent/video and POST /agent/image, quoted over HTTP 402 and settled in USDC on Base."

plugins:
  - jekyll-sitemap

# README.md is the GitHub repo landing page; index.md is the built Pages
# home page. Excluding README.md keeps Jekyll from also emitting it as
# README.html alongside index.html.
exclude:
  - README.md
